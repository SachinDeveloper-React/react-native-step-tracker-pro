name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: TypeScript, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test -- --ci
      - run: npm run build
      - name: Pack and inspect what would be published
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          # Tests, mocks and build output must never ship.
          ! grep -E '__tests__|__mocks__|android/build/' pack.txt

  android:
    name: Kotlin compile, JVM tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
      - name: Compile, test, lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug compileDebugAndroidTestKotlin
      - name: Lint must be clean of errors
        working-directory: android
        run: |
          ! grep -q 'severity="Error"' build/reports/lint-results-debug.xml
          ! grep -q 'severity="Fatal"' build/reports/lint-results-debug.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/build/reports/
            android/build/test-results/
          if-no-files-found: ignore

  android-instrumented:
    name: Engine tests on an emulator
    runs-on: ubuntu-latest
    # Emulator runs are slow; keep them off pull requests from forks.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-results
          path: android/build/outputs/androidTest-results/
          if-no-files-found: ignore
