buildscript {
    // Consumers can override in the app's root build.gradle:
    //   ext { kotlinVersion = "2.2.0"; roomVersion = "2.7.1" }
    //
    // Room's annotation processing runs through kapt rather than KSP on
    // purpose. A KSP plugin version has to match the Kotlin plugin version
    // exactly, and a library cannot know which Kotlin the host app will bring:
    // pinning one here breaks every app on a different Kotlin, and there is no
    // way to derive the KSP suffix from the Kotlin version. kapt ships inside
    // the Kotlin Gradle plugin, so it matches the host automatically, and this
    // module's processing surface is two entities and two DAOs.
    ext.stp_kotlinVersion = rootProject.ext.has("kotlinVersion")
            ? rootProject.ext.get("kotlinVersion") : "2.0.21"

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Only when this module is the root of the build - compiled on its
        // own, for CI and development. Inside an app the host's Android and
        // Kotlin plugins are already on the classpath; declaring a second,
        // older AGP next to an AGP 9 host is how a library breaks an app.
        if (project == rootProject) {
            classpath "com.android.tools.build:gradle:8.6.0"
            // Bare references, not ${ext.…}: inside a nested dependencies{}
            // block `ext` resolves to the buildscript's own extra properties.
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$stp_kotlinVersion"
        } else {
            // AGP 9 with built-in Kotlin refuses the Kotlin kapt plugin and
            // provides `com.android.legacy-kapt` instead - from a separate
            // artifact, gradle-kotlin, that React Native apps do not put on
            // the classpath. It is added here at the host's own AGP version,
            // and only in that mode. This block runs before the rest of the
            // script, so the check is inlined rather than shared.
            // By reflection: this block is compiled before the app's
            // classpath exists. Every loader that can see the app's AGP is
            // tried - the root buildscript's for an app that puts AGP on its
            // buildscript classpath, the script's own for one that loads it
            // through a plugins {} block, whose classes it inherits.
            def hostAgp = null
            def loaders = [
                this.class.classLoader,
                rootProject.buildscript.classLoader,
                Thread.currentThread().contextClassLoader
            ]
            for (loader in loaders) {
                if (hostAgp != null || loader == null) continue
                try {
                    hostAgp = loader.loadClass("com.android.Version")
                        .getField("ANDROID_GRADLE_PLUGIN_VERSION")
                        .get(null)?.toString()
                } catch (Throwable ignored) {
                }
            }
            def builtIn = project.findProperty("android.builtInKotlin")
            if (hostAgp != null && hostAgp.tokenize(".")[0].toInteger() >= 9 &&
                    (builtIn == null || builtIn.toString() != "false")) {
                classpath "com.android.tools.build:gradle-kotlin:$hostAgp"
            }
        }
    }
}

/**
 * The host's React Native version, read from its package.json: walking up
 * from the Gradle root finds `node_modules/react-native` in a plain app and
 * in a hoisted monorepo alike, and finds this package's own devDependency
 * when it is built on its own. `-PstpReactNativeVersion` overrides it.
 */
def reactNativeVersion() {
    def override = project.findProperty("stpReactNativeVersion")
    if (override) return override.toString()
    def dir = project.rootDir
    for (int i = 0; i < 6 && dir != null; i++) {
        def manifest = new File(dir, "node_modules/react-native/package.json")
        if (manifest.isFile()) {
            return new groovy.json.JsonSlurper().parse(manifest).version?.toString()
        }
        dir = dir.parentFile
    }
    return null
}

/** Minor version of a 0.x release; anything past 0.x counts as newer than all of them. */
def reactNativeMinor() {
    def version = reactNativeVersion()
    if (version == null) return null
    def parts = version.tokenize(".-")
    if (parts.size() < 2) return null
    return parts[0] == "0" ? (parts[1].isInteger() ? parts[1].toInteger() : null) : 10_000
}

/**
 * React Native 0.82 removed the legacy architecture, so from there on the
 * new one is the only one - whether or not the app's gradle.properties still
 * says `newArchEnabled=true`, which newer templates are free to drop. Below
 * 0.82 the property decides, as it always has.
 *
 * When neither is known - a layout where `node_modules/react-native` is not
 * where it is looked for, and no property - the new architecture is assumed:
 * it has been the default since 0.76, every supported release's template
 * sets the property when it wants the old one, and guessing old on 0.82+
 * builds code that release cannot run.
 */
def isNewArchitectureEnabled() {
    def minor = reactNativeMinor()
    if (minor != null && minor >= 82) return true
    def flag = project.findProperty("newArchEnabled")
    if (flag != null) return flag.toString() == "true"
    return minor == null
}

/** Major version of the Android Gradle Plugin actually running the build. */
def agpMajor() {
    try {
        return com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0].toInteger()
    } catch (Throwable ignored) {
        return 8
    }
}

/**
 * AGP 9 compiles Kotlin itself unless the app sets
 * `android.builtInKotlin=false`. With it on, applying the Kotlin Android
 * plugin is an error and kapt comes from AGP's `com.android.legacy-kapt`;
 * with it off - or on AGP 8 - it is the Kotlin plugin and its kapt, as before.
 */
def usesBuiltInKotlin() {
    if (agpMajor() < 9) return false
    def flag = project.findProperty("android.builtInKotlin")
    return flag == null || flag.toString() != "false"
}

apply plugin: "com.android.library"
if (usesBuiltInKotlin()) {
    apply plugin: "com.android.legacy-kapt"
} else {
    apply plugin: "org.jetbrains.kotlin.android"
    apply plugin: "org.jetbrains.kotlin.kapt"
}
if (isNewArchitectureEnabled()) {
    apply plugin: "com.facebook.react"
}

def safeExtGet(prop, fallback) {
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

def compileSdkLevel = safeExtGet("compileSdkVersion", 35).toString().replaceAll("[^0-9]", "").toInteger()

// Room 2.7+ is required to read Kotlin 2.x metadata: 2.6.1's bundled
// kotlinx-metadata rejects anything above Kotlin 2.0 with "Provided Metadata
// instance has version 2.2.0, while maximum supported version is 2.0.0". It in
// turn needs Kotlin 2.0+, which is what sets this package's React Native floor.
// On react-native 0.74-0.76 (Kotlin 1.9.24), pin roomVersion = "2.6.1".
def roomVersion = safeExtGet("roomVersion", "2.7.2")
// Health Connect 1.1.0 stable needs compileSdk 36 and AGP 8.9.1+. An app on
// that toolchain gets it; an older one - React Native below 0.81 - keeps
// 1.1.0-beta01, the newest release that builds against compileSdk 35 with
// the same Metadata API. ext.healthConnectVersion overrides either.
def healthConnectVersion = safeExtGet(
    "healthConnectVersion", compileSdkLevel >= 36 ? "1.1.0" : "1.1.0-beta01"
)
def workVersion = safeExtGet("workVersion", "2.9.1")

// The npm version, compiled in so a verification snapshot can say which
// release produced it. package.json sits next to android/ in the published
// package and in this repository alike.
def libraryVersion = {
    def manifest = file("$projectDir/../package.json")
    manifest.isFile() ? new groovy.json.JsonSlurper().parse(manifest).version.toString() : "unknown"
}()

android {
    namespace "com.steptrackerpro"
    compileSdk compileSdkLevel

    defaultConfig {
        // 26 is the floor for java.time and for the Health Connect client.
        // Declared as at least that whatever the app says, so an app below it
        // fails the manifest merge naming this package - React Native's own
        // template starts at 24 - rather than somewhere inside it.
        minSdk Math.max(safeExtGet("minSdkVersion", 26).toString().toInteger(), 26)
        targetSdk safeExtGet("targetSdkVersion", 35)
        consumerProguardFiles "consumer-rules.pro"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
        buildConfigField "String", "LIBRARY_VERSION", "\"${libraryVersion}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The architecture shim lives in one of two directories. They are
            // registered as Kotlin sources as well as Java ones: AGP 9's
            // built-in Kotlin compiles only `kotlin` source directories and the
            // defaults, so a directory added to `java` alone is invisible to it.
            def archDirs = isNewArchitectureEnabled() ? [
                "src/newarch/java",
                layout.buildDirectory.dir("generated/source/codegen/java").get().asFile
            ] : ["src/oldarch/java"]
            java.srcDirs += archDirs
            kotlin.srcDirs += archDirs
        }
        // Room's exported schemas, so MigrationTestHelper can build the
        // database as an older version really had it and run the migrations
        // against real rows. Test-only: `android/schemas` is not published.
        androidTest {
            assets.srcDirs += files("$projectDir/schemas")
        }
    }

    lint {
        abortOnError false
    }
}

// `kotlinOptions {}` is deprecated from Kotlin 2.0 and an error in Kotlin build
// scripts from 2.2; `compilerOptions` works from 2.0, this package's floor,
// under the Kotlin Android plugin and AGP 9's built-in Kotlin alike.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        // Room reads the DAO interfaces' default methods, so bodies must
        // compile to real JVM default methods. Kotlin 2.2 made that a typed
        // option and deprecated the -X flag; older Kotlin only has the flag.
        if (compilerOptions.hasProperty("jvmDefault")) {
            jvmDefault = org.jetbrains.kotlin.gradle.dsl.JvmDefaultMode.NO_COMPATIBILITY
        } else {
            freeCompilerArgs.add("-Xjvm-default=all")
        }
    }
}

kapt {
    arguments {
        arg("room.schemaLocation", "$projectDir/schemas")
        arg("room.incremental", "true")
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.facebook.react:react-android"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"
    implementation "androidx.core:core-ktx:1.19.0"
    implementation "androidx.lifecycle:lifecycle-service:2.8.4"
    implementation "androidx.activity:activity-ktx:1.9.2"

    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    kapt "androidx.room:room-compiler:$roomVersion"

    implementation "androidx.work:work-runtime-ktx:$workVersion"
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"

    // Activity Recognition for the integrity checks, compile-only on purpose:
    // an app that wants steps tagged "in a vehicle" or "still" adds
    // play-services-location itself, and one that does not never ships Play
    // Services because of this package. Nothing touches these classes until
    // a runtime check has found them.
    compileOnly "com.google.android.gms:play-services-location:21.3.0"
    // Play Integrity, the same way: an app that wants requestIntegrityToken()
    // adds com.google.android.play:integrity itself.
    compileOnly "com.google.android.play:integrity:1.4.0"

    testImplementation "junit:junit:4.13.2"
    // The SDK's org.json is a stub on the JVM (every method throws); the
    // real library stands in so the remote payload shape can be pinned by a
    // unit test instead of a device run.
    testImplementation "org.json:json:20240303"

    androidTestImplementation "androidx.test:core-ktx:1.6.1"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.room:room-testing:$roomVersion"
}
